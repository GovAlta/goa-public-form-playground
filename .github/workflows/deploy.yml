name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # `npm run build` runs `tsc -b` before vite, so every deploy is type-checked.
      # VITE_BASE_PATH is derived from the repository name, which is what lets a fork
      # deploy correctly without editing a single file.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages has no server-side rewrite. Serving a copy of index.html as
      # 404.html is what makes deep links like /review work: Pages cannot find the
      # path, serves 404.html, and the router takes over and renders the right page.
      #
      # Pages returns an HTTP 404 status alongside that document by design. The page
      # is correct; only the status code is misleading. Verify deep links by what
      # renders, never by status code.
      - name: SPA fallback for GitHub Pages
        run: cp ./dist/index.html ./dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
